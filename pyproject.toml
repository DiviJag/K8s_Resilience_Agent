[project]
name = "chaosloop"
version = "0.1.0"
description = "Closed-loop Kubernetes resilience agent with two-tier evaluation"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "typer>=0.12",
    "python-dotenv>=1.0",
    # Core rather than an extra: LiveBackend is the production path, and a plain `uv sync`
    # silently uninstalls extras it was not asked for, breaking the Recorder mid-session.
    "kubernetes>=31.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
]

[project.scripts]
chaosloop-eval = "chaosloop.eval.cli:app"
chaosloop-record = "chaosloop.recorder.cli:app"
chaosloop-memory = "chaosloop.memory.cli:app"
chaosloop-dashboard = "chaosloop.dashboard.cli:app"
chaosloop-lab = "chaosloop.live.cli:app"
chaosloop-review = "chaosloop.live.cli:review_app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chaosloop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
