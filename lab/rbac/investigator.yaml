# Least privilege for the investigating agent (HLD §11): read-only, namespaced to the lab, and
# with no access to Secret values or ConfigMaps. A Secret referenced from a pod spec stays
# visible as a reference, which is all the agent needs to reason about it. lab-up.ps1 mints a
# short-lived token for this account into lab/.kubeconfig-investigator (gitignored).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: investigator
  namespace: chaosloop-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: chaosloop-investigator
  namespace: chaosloop-lab
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, events, services, endpoints, persistentvolumeclaims]
    verbs: [get, list, watch]
  - apiGroups: ["apps"]
    resources: [deployments, replicasets]
    verbs: [get, list, watch]
  - apiGroups: ["networking.k8s.io"]
    resources: [networkpolicies]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: chaosloop-investigator
  namespace: chaosloop-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: chaosloop-investigator
subjects:
  - kind: ServiceAccount
    name: investigator
    namespace: chaosloop-lab
---
# Cluster-scoped reads the tools need: get_node_status reports each node's labels, taints and
# allocatable, and sums pod requests per node across all namespaces (scheduling faults are about
# what else occupies the node).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: chaosloop-investigator-nodes
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: chaosloop-investigator-nodes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: chaosloop-investigator-nodes
subjects:
  - kind: ServiceAccount
    name: investigator
    namespace: chaosloop-lab
