incident_id: inc-missing_env_var-01
category: missing_env_var
symptom: CrashLoopBackOff
summary: PodCrashLooping on billing-service in chaosloop-lab
signals:
- Back-off restarting failed container billing in pod billing-service-6c4df46bf8-g9g49_chaosloop-lab(15c5c483-9b0d-4fe8-8f51-0dbcfb1c8ae0)
- Back-off restarting failed container billing in pod billing-service-6c4df46bf8-nvbls_chaosloop-lab(3c318319-535f-4cf5-b547-522e09ec92ea)
- unable to retrieve container logs for containerd://ffbc51daf87f42319582c30d285c83e49aec242c9b740ffb37204f30090e4226
