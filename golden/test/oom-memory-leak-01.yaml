expected:
  category: memory_leak
  root_cause: "report-builder runs for about 11 hours between OOM kills while its heap grows steadily with an unbounded report cache, so memory use climbs until it hits the 2Gi limit. The limit is not too low; the application leaks."
  fix_check:
    path: "*"
    must_exist: false
metadata:
  source: manual
  k8s_version: "1.30"
  runtime: containerd
  recorded: 2026-10-01
  note: "Discriminates memory_leak from memory_limit_too_low on run duration and heap growth. The fix is in the application, so a correct diagnosis proposes no manifest patch."
