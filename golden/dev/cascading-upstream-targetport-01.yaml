case_id: cascading-upstream-targetport-01
split: dev
trigger:
  alertname: PodCrashLooping
  service: checkout-api
  namespace: prod
  pod: checkout-api-84f6d9c7b5-mm7rd
evidence:
  get_pod_status:
    by_name:
      checkout-api-84f6d9c7b5-mm7rd:
        name: checkout-api-84f6d9c7b5-mm7rd
        namespace: prod
        phase: Running
        startTime: "2026-09-29T15:12:40Z"
        containerStatuses:
          - name: checkout
            ready: false
            restartCount: 8
            image: "registry.internal:5000/checkout-api:v7.0.3"
            state:
              waiting:
                reason: CrashLoopBackOff
                message: "back-off 5m0s restarting failed container=checkout pod=checkout-api-84f6d9c7b5-mm7rd_prod"
            lastState:
              terminated:
                exitCode: 1
                reason: Error
                startedAt: "2026-09-29T15:44:02Z"
                finishedAt: "2026-09-29T15:44:13Z"
  get_events:
    by_name:
      checkout-api:
        - type: Warning
          reason: BackOff
          count: 28
          message: "Back-off restarting failed container checkout in pod checkout-api-84f6d9c7b5-mm7rd_prod"
      session-cache:
        - type: Normal
          reason: ScalingReplicaSet
          count: 1
          message: "Scaled up replica set session-cache-5b9c8d7f46 to 2"
  get_logs:
    by_name:
      checkout-api-84f6d9c7b5-mm7rd:
        current: ""
        previous: |
          [checkout] boot v7.0.3
          [checkout] session store: redis://session-cache.prod.svc.cluster.local:6379
          [checkout] redis: dial tcp 10.96.88.21:6379: connect: connection refused (retry 1/3)
          [checkout] redis: dial tcp 10.96.88.21:6379: connect: connection refused (retry 3/3)
          [checkout] fatal: session store unreachable
  get_deployment_spec:
    by_name:
      checkout-api:
        metadata: {name: checkout-api, namespace: prod, generation: 31}
        spec:
          replicas: 3
          selector:
            matchLabels: {app: checkout-api}
          template:
            metadata:
              labels: {app: checkout-api}
            spec:
              containers:
                - name: checkout
                  image: "registry.internal:5000/checkout-api:v7.0.3"
                  env:
                    - {name: SESSION_STORE_URL, value: "redis://session-cache.prod.svc.cluster.local:6379"}
        status: {replicas: 3, readyReplicas: 0, unavailableReplicas: 3}
      session-cache:
        metadata: {name: session-cache, namespace: prod, generation: 4}
        spec:
          replicas: 2
          selector:
            matchLabels: {app: session-cache}
          template:
            metadata:
              labels: {app: session-cache}
            spec:
              containers:
                - name: redis
                  image: "redis:7.2"
                  ports: [{containerPort: 6379}]
        status: {replicas: 2, readyReplicas: 2, unavailableReplicas: 0}
  get_service:
    by_name:
      checkout-api:
        metadata: {name: checkout-api, namespace: prod}
        spec:
          selector: {app: checkout-api}
          ports: [{port: 80, targetPort: 8080, protocol: TCP}]
      session-cache:
        metadata: {name: session-cache, namespace: prod}
        spec:
          selector: {app: session-cache}
          ports: [{port: 6379, targetPort: 6380, protocol: TCP}]
  get_endpoints:
    by_name:
      checkout-api:
        metadata: {name: checkout-api, namespace: prod}
        subsets:
          - notReadyAddresses: [{ip: 10.244.1.12}, {ip: 10.244.2.17}, {ip: 10.244.1.19}]
            ports: [{port: 8080}]
      session-cache:
        metadata: {name: session-cache, namespace: prod}
        subsets:
          - addresses: [{ip: 10.244.1.55}, {ip: 10.244.2.61}]
            ports: [{port: 6380}]
  get_pvc_status: not available
  get_node_status:
    - name: kind-worker
      conditions: [{type: Ready, status: "True"}]
      taints: []
      allocatable: {cpu: "4", memory: 8038084Ki, pods: "110"}
expected:
  category: target_port_mismatch
  root_cause: "checkout-api crashes because its session store is unreachable: the session-cache Service forwards to targetPort 6380 while redis listens on 6379, so connections are refused. checkout-api's own configuration is correct."
  fix_check:
    path: spec.ports.targetPort
    must_exist: true
metadata:
  source: manual
  k8s_version: "1.30"
  runtime: containerd
  recorded: 2026-10-01
  note: "Cascading failure in the dev split, so prompts can be tuned on the pattern without touching the test case."
