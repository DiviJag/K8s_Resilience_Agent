name: tier-a-live

# Real-model accuracy gate on the held-out test split. Kept off per-PR because model calls
# cost money and vary run to run; promote to pull_request once that is acceptable.
on:
  workflow_dispatch:
    inputs:
      split:
        description: dev or test
        default: test
      repeats:
        description: runs per case
        default: "3"
  schedule:
    - cron: "0 6 * * *"

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync
      # This gate calls a real, paid model, so it only runs where credentials are configured.
      # Without them (e.g. a fork, or before the repo secret/variable is set) it skips green
      # rather than failing the scheduled run - and never spends money unattended.
      - name: Check credentials
        id: creds
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CHAOSLOOP_MODEL: ${{ vars.CHAOSLOOP_MODEL }}
        run: |
          if [ -n "$OPENROUTER_API_KEY" ] && [ -n "$CHAOSLOOP_MODEL" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping real-model eval: set the OPENROUTER_API_KEY secret and the CHAOSLOOP_MODEL repository variable to enable it."
          fi
      - name: Tier A golden-set eval
        if: steps.creds.outputs.ready == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CHAOSLOOP_MODEL: ${{ vars.CHAOSLOOP_MODEL }}
          CHAOSLOOP_JUDGE_MODEL: ${{ vars.CHAOSLOOP_JUDGE_MODEL }}
        run: |
          args="--split ${{ inputs.split || 'test' }} --repeats ${{ inputs.repeats || 3 }}"
          # The calibrator is fit on dev results and committed; apply it whenever it exists.
          if [ -f calibration/isotonic.json ]; then
            args="$args --calibrator calibration/isotonic.json"
          fi
          uv run chaosloop-eval run $args
      - uses: actions/upload-artifact@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          name: eval-run
          path: eval/runs/
